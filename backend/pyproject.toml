[project]
name = "mabat-backend"
version = "0.1.0"
description = "Mabat API — 3D structure showcase"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "trimesh>=4.4",
    "numpy>=1.26",
    "pillow>=10.4",
    "networkx>=3.3",
    "aiofiles>=24.1",
    "typer>=0.12",
    "pycollada>=0.9.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "debugpy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
