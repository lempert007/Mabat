server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Model and attachment uploads can be large.
    client_max_body_size 1024m;

    gzip on;
    # Responses coming back through proxy_pass are not compressed unless this says so, and the
    # model is one of them. A typical GLB halves.
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
