services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mabat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-mabat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mabat} -d ${POSTGRES_DB:-mabat}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mabat}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-mabat}
      MABAT_STORAGE_ROOT: /data
      MABAT_SECRET_KEY: ${MABAT_SECRET_KEY:?set MABAT_SECRET_KEY in .env}
      MABAT_MAX_UPLOAD_MB: ${MABAT_MAX_UPLOAD_MB:-512}
      MABAT_INITIAL_EDITOR_USERNAME: ${MABAT_INITIAL_EDITOR_USERNAME:-}
      MABAT_INITIAL_EDITOR_PASSWORD: ${MABAT_INITIAL_EDITOR_PASSWORD:-}
      MABAT_SESSION_HOURS: ${MABAT_SESSION_HOURS:-72}
      MABAT_SECURE_COOKIES: ${MABAT_SECURE_COOKIES:-false}
    volumes:
      - ${MABAT_STORAGE_ROOT:-./storage}:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
